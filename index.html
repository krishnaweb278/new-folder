<!DOCTYPE html>

<html>
<head>
  
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Hello, World!</title>
</head>
<body>
  <div>
    <table border="1px" >
      <tr>
        <th colspan="3"><input type="text" id="t1"></th>
        <th><button onclick=cl()>clear</button></th>
      </tr>
      <tr>
        <th><button onclick=tap(1) value="1">1</button></th>
        <th><button onclick=tap(2) value="2">2</button></th>
        <th><button onclick=tap(3) value="3">3</button></th>
        <th><button onclick=tap('+') value="+">+</button></th>
      </tr>
      <tr>
        <th><button onclick=tap(4) value="4">4</button></th>
        <th><button onclick=tap(5) value="5">5</button></th>
        <th><button onclick=tap(6) value="6">6</button></th>
        <th><button onclick=tap('-') value="-">-</button></th>
      </tr>
      <tr>
        <th><button onclick=tap(7) value="7">7</button></th>
        <th><button onclick=tap(8) value="8">8</button></th>
        <th><button onclick=tap(9) value="9">9</button></th>
        <th><button onclick=tap('*') value="*">x</button></th>
      </tr>
      <tr>
        <th><button onclick=tap('.') value=".">.</button></th>
        <th><button onclick=tap(0) value="0">0</button></th>
        <th><button onclick=ok() value="=">=</button></th>
        <th><button onclick=tap('/') value="/">÷</button></th>
      </tr>
      
    </table>
  </div>
</body>
<script>
function tap(a)
{
  var t=a;
  document.getElementById("t1").value+=a;
}
function  ok()
{
  var g=document.getElementById("t1").value;
  var o=eval(g);
  document.getElementById("t1").value=o;
}
function cl()
{
  document.getElementById("t1").value="";
}
  
  </script>
</html>
